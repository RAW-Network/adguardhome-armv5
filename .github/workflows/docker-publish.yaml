name: Docker Image CI

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile']

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      has_update: ${{ steps.compare.outputs.HAS_UPDATE }}
      repo_lower: ${{ steps.repo.outputs.REPO_LOWER }}

    steps:
      - name: Set lowercase repository name
        id: repo
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream version
        id: upstream
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest | jq -r .tag_name)
          echo "Upstream: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare with GHCR
        id: compare
        run: |
          IMAGE="ghcr.io/${{ steps.repo.outputs.REPO_LOWER }}:${{ steps.upstream.outputs.VERSION }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "HAS_UPDATE=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_UPDATE=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "### Update Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: ${{ steps.upstream.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Update available: ${{ steps.compare.outputs.HAS_UPDATE }}" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: check-update
    if: needs.check-update.outputs.has_update == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v5
          push: false
          load: true
          tags: agh:local

      - name: Detect version
        id: version
        run: |
          RAW=$(docker run --rm agh:local ./AdGuardHome --version || true)
          VER=$(echo "$RAW" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$VER" ]; then
            echo "Failed to detect version from: $RAW"
            exit 1
          fi
          echo "AGH_VERSION=v$VER" >> "$GITHUB_OUTPUT"

      - name: Push to GHCR
        run: |
          REPO="ghcr.io/${{ needs.check-update.outputs.repo_lower }}"
          VERSION="${{ steps.version.outputs.AGH_VERSION }}"
          docker tag agh:local "$REPO:latest"
          docker tag agh:local "$REPO:$VERSION"
          docker push "$REPO:latest"
          docker push "$REPO:$VERSION"

      - name: Summary
        run: |
          echo "### Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.AGH_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/${{ needs.check-update.outputs.repo_lower }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/${{ needs.check-update.outputs.repo_lower }}" >> "$GITHUB_STEP_SUMMARY"